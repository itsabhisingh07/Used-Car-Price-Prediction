<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .container {
            max_width: 600px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }
        .btn-predict {
            background-color: #0d6efd;
            color: white;
            width: 100%;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #d1e7dd;
            color: #0f5132;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center mb-4">Car Price Prediction</h2>
        <p class="text-center text-muted">Enter the car details below to get an estimated selling price.</p>

        <form action="{{ url_for('predict') }}" method="post">
            
            <div class="mb-3">
                <label class="form-label">Car Model Name</label>
                <input type="text" class="form-control" name="car_model" placeholder="Swift Dzire VDI" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Year of Purchase</label>
                <input type="number" class="form-control" name="year" placeholder="2015" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Kilometers Driven</label>
                <input type="number" class="form-control" name="km_driven" placeholder="50000" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Fuel Type</label>
                <select class="form-select" name="fuel_type" required>
                    <option value="" selected disabled>Select Fuel</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="CNG">CNG</option>
                    <option value="LPG">LPG</option>
                    <option value="Electric">Electric</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Seller Type</label>
                <select class="form-select" name="seller_type" required>
                    <option value="" selected disabled>Select Seller</option>
                    <option value="Individual">Individual</option>
                    <option value="Dealer">Dealer</option>
                    <option value="Trustmark Dealer">Trustmark Dealer</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Transmission</label>
                <select class="form-select" name="transmission_type" required>
                    <option value="" selected disabled>Select Transmission</option>
                    <option value="Manual">Manual</option>
                    <option value="Automatic">Automatic</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Mileage (kmpl)</label>
                <input type="number" step="0.1" class="form-control" name="mileage" placeholder="24.5 km/h" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Engine CC</label>
                <input type="number" class="form-control" name="engine" placeholder="1197cc" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Max Power (bhp)</label>
                <input type="number" step="0.1" class="form-control" name="max_power" placeholder="88.5 bhp" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Seats</label>
                <input type="number" class="form-control" name="seats" placeholder="5" required>
            </div>

            <button type="submit" class="btn btn-predict mt-3">Predict Price</button>
        </form>

        {% if prediction_text %}
        <div class="result-box">
            {{ prediction_text }}
        </div>
        {% endif %}

    </div>

</body>
</html>
